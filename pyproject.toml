[project]
name = "ogha-sdk-examples"
version = "0.1.0"
description = "Runnable Python examples for every Ogha documentation use case"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vedh Labs" }]
dependencies = ["ogha==0.1.3"]

[project.optional-dependencies]
alpaca = ["httpx>=0.28"]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/example_support",
  "src/quickstart",
  "src/checkout",
  "src/reports",
  "src/ecommerce",
  "src/lending",
  "src/trading",
  "src/primitives",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

