# Local Aga stack used by every example in this repository.
name: aga-sdk-examples
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aga
      POSTGRES_PASSWORD: aga-local
      POSTGRES_DB: aga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aga -d aga"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aga-postgres:/var/lib/postgresql/data

  aga:
    image: ${AGA_ENGINE_IMAGE:-aga:dev}
    build:
      context: ../aga
      dockerfile: Dockerfile
      args:
        TAGS: aga_postgres
      secrets:
        - github_token
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --storage=postgres
      - --dsn=postgres://aga:aga-local@postgres:5432/aga?sslmode=disable
      - --auth-disabled
      - --addr=0.0.0.0:8080
    ports:
      - "8080:8080"

volumes:
  aga-postgres:

secrets:
  github_token:
    environment: GITHUB_TOKEN
